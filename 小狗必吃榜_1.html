<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🐾 小狗必吃榜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#FF6B35;--brand-dark:#E8521E;
  --bg:#F7F5F2;--card:#fff;--border:#eee;--text:#1a1a1a;--muted:#888;
}
body,html{font-family:'PingFang SC','Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);}
.app{max-width:390px;margin:0 auto;background:var(--bg);min-height:100vh;}

/* 隐藏编辑入口 - 右下角小按钮 */
.secret-btn{position:fixed;bottom:80px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.12);border:none;cursor:pointer;font-size:16px;z-index:50;color:#fff;display:flex;align-items:center;justify-content:center;}

/* 密码弹窗 */
.pw-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:400;align-items:center;justify-content:center;}
.pw-overlay.show{display:flex;}
.pw-card{background:#fff;border-radius:20px;padding:28px 24px;width:280px;text-align:center;}
.pw-title{font-size:17px;font-weight:700;margin-bottom:6px;}
.pw-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.pw-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:16px;text-align:center;letter-spacing:4px;font-family:inherit;color:var(--text);margin-bottom:12px;}
.pw-input:focus{outline:none;border-color:var(--brand);}
.pw-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:28px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.pw-err{font-size:12px;color:#e74c3c;margin-top:8px;display:none;}

/* Header */
.header{background:var(--card);padding:12px 16px 0;border-bottom:1px solid var(--border);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.shop-name{font-size:17px;font-weight:700;}
.shop-tag{background:var(--brand);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:8px;}
.tabs{display:flex;}
.tab{padding:8px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:500;}
.body{display:flex;height:calc(100vh - 130px);}
.sidebar{width:82px;background:var(--bg);overflow-y:auto;flex-shrink:0;}
.cat-item{padding:13px 6px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;border-left:3px solid transparent;line-height:1.4;}
.cat-item.active{background:var(--card);color:var(--brand);border-left-color:var(--brand);font-weight:500;}
.menu-list{flex:1;overflow-y:auto;padding:0 12px 110px;}
.section-title{font-size:13px;color:var(--muted);padding:12px 0 6px;font-weight:500;}
.menu-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f5f5f5;align-items:flex-start;}
.item-img{width:80px;height:80px;border-radius:10px;background:#f0ebe3;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:15px;font-weight:500;margin-bottom:4px;}
.item-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px;}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;}
.badge-hot{background:#FFF0E6;color:#E8521E;}
.badge-new{background:#E8F4FF;color:#1890FF;}
.badge-rec{background:#FFF8E6;color:#F5A623;}
.item-tags{font-size:11px;color:var(--muted);margin-bottom:7px;}
.item-bottom{display:flex;align-items:center;justify-content:space-between;}
.item-price{font-size:17px;font-weight:700;color:var(--brand);}
.item-price-orig{font-size:11px;color:#ccc;text-decoration:line-through;margin-left:3px;}
.cart-ctrl{display:flex;align-items:center;gap:7px;}
.btn-add,.btn-minus{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.btn-add{background:var(--brand);color:#fff;}
.btn-add:active{transform:scale(0.88);}
.btn-minus{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
.cart-qty{font-size:15px;font-weight:600;min-width:20px;text-align:center;}
.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;background:#1a1a1a;color:#fff;display:flex;align-items:center;padding:12px 16px;gap:12px;z-index:100;}
.cart-icon-wrap{position:relative;}
.cart-icon{font-size:26px;}
.cart-count{position:absolute;top:-6px;right:-8px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.cart-amount{font-size:18px;font-weight:700;color:var(--brand);}
.cart-sub{font-size:11px;color:#888;}
.submit-btn{background:var(--brand);color:#fff;border:none;border-radius:24px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.submit-btn.disabled{background:#555;cursor:not-allowed;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:390px;animation:slideUp 0.3s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:16px;text-align:center;}
.order-list{max-height:200px;overflow-y:auto;margin-bottom:14px;}
.order-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:14px;}
.confirm-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:28px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;}
.note-input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;resize:none;margin-bottom:12px;color:var(--text);}
.success-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;align-items:center;justify-content:center;}
.success-overlay.show{display:flex;}
.success-card{background:var(--card);border-radius:20px;padding:30px 24px;text-align:center;width:280px;animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}
.success-emoji{font-size:52px;margin-bottom:12px;}
.success-title{font-size:20px;font-weight:700;margin-bottom:8px;}
.success-sub{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px;}
.success-close{background:var(--brand);color:#fff;border:none;border-radius:28px;padding:12px 32px;font-size:15px;cursor:pointer;font-family:inherit;}

/* Editor */
.editor{display:none;padding:14px;background:var(--bg);min-height:100vh;padding-bottom:60px;}
.editor.show{display:block;}
.ed-section{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;}
.ed-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.ed-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.ed-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;}
.ed-input:focus{outline:none;border-color:var(--brand);}
.ed-label{font-size:12px;color:var(--muted);white-space:nowrap;min-width:52px;}
.ed-btn{border:none;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;}
.ed-btn-add{background:var(--brand);color:#fff;}
.ed-btn-del{background:#fff;color:#e74c3c;border:1px solid #e74c3c;}
.ed-btn-save{background:var(--brand);color:#fff;width:100%;padding:12px;border-radius:28px;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit;margin-top:4px;}
.ed-btn-exit{background:#444;color:#fff;width:100%;padding:11px;border-radius:28px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit;margin-top:8px;}
.cat-block{background:#fafafa;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.cat-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.dish-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.dish-row input{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;color:var(--text);}
.dish-row input:focus{outline:none;border-color:var(--brand);}
.email-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:28px;font-size:14px;z-index:999;display:none;white-space:nowrap;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:10px}
</style>
</head>
<body>
<div id="app">

<!-- 点餐页 -->
<div id="customerView" class="app">
  <div class="header">
    <div class="header-top">
      <div style="display:flex;align-items:center">
        <span class="shop-name" id="shopNameDisplay">🐾 小狗必吃榜</span>
        <span class="shop-tag" id="shopTagDisplay">私厨定制</span>
      </div>
      <span style="font-size:22px">🫶</span>
    </div>
    <div class="tabs">
      <div class="tab active">点菜</div>
      <div class="tab" style="color:#ccc">评价 ★4.9</div>
      <div class="tab" style="color:#ccc">商家</div>
    </div>
  </div>
  <div class="body">
    <div class="sidebar" id="sidebar"></div>
    <div class="menu-list" id="menuList"></div>
  </div>
</div>

<!-- 隐藏编辑按钮（连点3次触发） -->
<button class="secret-btn" id="secretBtn" title="">🐾</button>

<!-- 购物车栏 -->
<div class="cart-bar" id="cartBar">
  <div class="cart-icon-wrap">
    <span class="cart-icon">🛒</span>
    <span class="cart-count" id="cartCount" style="display:none">0</span>
  </div>
  <div style="flex:1">
    <div class="cart-amount" id="cartAmount">¥0.0</div>
    <div class="cart-sub" id="cartSub">还没选菜哦～</div>
  </div>
  <button class="submit-btn disabled" id="submitBtn" onclick="openSheet()">提交订单</button>
</div>

<!-- 确认弹窗 -->
<div class="overlay" id="orderSheet" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="sheet">
    <div class="sheet-title">🐾 确认订单</div>
    <div class="order-list" id="orderListDetail"></div>
    <div style="display:flex;justify-content:space-between;font-weight:600;margin-bottom:14px;font-size:15px">
      <span>合计</span><span id="sheetTotal" style="color:var(--brand)">¥0.0</span>
    </div>
    <textarea class="note-input" id="noteInput" rows="2" placeholder="备注口味、辣度…爱你❤️"></textarea>
    <button class="confirm-btn" onclick="submitOrder()">🛎️ 呼叫大厨！</button>
  </div>
</div>

<!-- 成功提示 -->
<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-emoji">🐶</div>
    <div class="success-title">汪！订单发出啦</div>
    <div class="success-sub" id="successMsg">大厨已收到通知<br>稍等一会儿就好！</div>
    <button class="success-close" onclick="closeSuccess()">好哒 ✨</button>
  </div>
</div>

<!-- 密码弹窗 -->
<div class="pw-overlay" id="pwOverlay">
  <div class="pw-card">
    <div class="pw-title">🔐 大厨专属通道</div>
    <div class="pw-sub">输入密码进入编辑器</div>
    <input class="pw-input" type="password" id="pwInput" placeholder="••••" maxlength="20"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">进入编辑器</button>
    <div class="pw-err" id="pwErr">密码错误，再试试～</div>
    <div style="margin-top:12px">
      <button onclick="document.getElementById('pwOverlay').classList.remove('show')"
        style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit">取消</button>
    </div>
  </div>
</div>

<!-- 编辑器 -->
<div id="editorView" class="editor">
  <div class="ed-section">
    <div class="ed-title">🏪 基本设置</div>
    <div class="ed-row"><span class="ed-label">店铺名</span><input class="ed-input" id="edShopName" value="🐾 小狗必吃榜"></div>
    <div class="ed-row"><span class="ed-label">副标签</span><input class="ed-input" id="edShopTag" value="私厨定制"></div>
    <div class="ed-row"><span class="ed-label">编辑密码</span><input class="ed-input" id="edPassword" type="password" placeholder="修改编辑器密码"></div>
  </div>
  <div class="ed-section">
    <div class="ed-title">📧 邮件通知</div>
    <div class="ed-row"><span class="ed-label">Service ID</span><input class="ed-input" id="edServiceId" value="service_co65wh5"></div>
    <div class="ed-row"><span class="ed-label">Template ID</span><input class="ed-input" id="edTemplateId" value="template_aurbnvc"></div>
    <div class="ed-row"><span class="ed-label">Public Key</span><input class="ed-input" id="edPublicKey" value="Ky0W9ki3RmCF-N32L"></div>
    <div class="ed-row"><span class="ed-label">你的邮箱</span><input class="ed-input" id="edEmail" value="yuan_guohua@163.com"></div>
    <div class="email-hint">💡 女朋友下单后订单详情发到你的163邮箱</div>
  </div>
  <div class="ed-section">
    <div class="ed-title">🍜 菜品管理</div>
    <div id="catList"></div>
    <button class="ed-btn ed-btn-add" onclick="addCat()" style="width:100%;margin-top:4px">+ 新增分类</button>
  </div>
  <button class="ed-btn-save" onclick="saveAll()">✅ 保存并应用</button>
  <button class="ed-btn-exit" onclick="exitEditor()">← 退出编辑器</button>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
// ===== 密码（默认1234，可在编辑器里改）=====
let PASSWORD = '1234';

let MENU = [
  {cat:"🔥 招牌砂锅粥",items:[
    {id:1,name:"三拼自由搭配砂锅粥",emoji:"🍲",price:19.9,orig:35.8,monthly:700,tags:"份量十足 · 35人觉得分量足",badges:["hot","rec"]},
    {id:2,name:"双拼自由搭配砂锅粥",emoji:"🍜",price:19.9,orig:27.8,monthly:400,tags:"实物跟商家描述一致",badges:["hot"]},
    {id:3,name:"活虾砂锅粥",emoji:"🦐",price:19.9,orig:null,monthly:200,tags:"粥的口感滑嫩",badges:["new","hot"]},
  ]},
  {cat:"💕 爱心特供",items:[
    {id:4,name:"心形煎蛋饭套餐",emoji:"🍳",price:15.9,orig:22,monthly:88,tags:"爱你每一天",badges:["new"]},
    {id:5,name:"玫瑰花饺子（6只）",emoji:"🌹",price:22,orig:28,monthly:55,tags:"手工花形捏制",badges:["rec"]},
  ]},
  {cat:"🥗 营养蔬菜",items:[
    {id:6,name:"清炒时令蔬菜",emoji:"🥬",price:12,orig:null,monthly:300,tags:"新鲜采购",badges:[]},
    {id:7,name:"蒜蓉空心菜",emoji:"🌿",price:13,orig:null,monthly:180,tags:"大蒜提香",badges:["rec"]},
  ]},
  {cat:"🍹 饮品甜点",items:[
    {id:8,name:"手打柠檬茶",emoji:"🍋",price:12,orig:16,monthly:220,tags:"现打现喝",badges:["hot"]},
    {id:9,name:"红豆汤圆",emoji:"🍡",price:8,orig:null,monthly:90,tags:"甜蜜收尾",badges:["new"]},
    {id:10,name:"草莓雪花冰",emoji:"🍓",price:16,orig:20,monthly:150,tags:"季节限定",badges:["new","rec"]},
  ]},
];

let CONFIG = {
  shopName:"🐾 小狗必吃榜",shopTag:"私厨定制",
  serviceId:"service_co65wh5",templateId:"template_aurbnvc",
  publicKey:"Ky0W9ki3RmCF-N32L",email:"yuan_guohua@163.com"
};

const cart={};
let nextId=100;

// ===== 秘密入口：连点3次 =====
let clickCount=0,clickTimer=null;
document.getElementById('secretBtn').addEventListener('click',()=>{
  clickCount++;
  clearTimeout(clickTimer);
  clickTimer=setTimeout(()=>clickCount=0,800);
  if(clickCount>=3){
    clickCount=0;
    document.getElementById('pwInput').value='';
    document.getElementById('pwErr').style.display='none';
    document.getElementById('pwOverlay').classList.add('show');
    setTimeout(()=>document.getElementById('pwInput').focus(),100);
  }
});

function checkPw(){
  const val=document.getElementById('pwInput').value;
  if(val===PASSWORD){
    document.getElementById('pwOverlay').classList.remove('show');
    openEditor();
  } else {
    document.getElementById('pwErr').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}

function openEditor(){
  document.getElementById('customerView').style.display='none';
  document.getElementById('cartBar').style.display='none';
  document.getElementById('secretBtn').style.display='none';
  document.getElementById('editorView').className='editor show';
  renderEditor();
}

function exitEditor(){
  document.getElementById('customerView').style.display='block';
  document.getElementById('cartBar').style.display='flex';
  document.getElementById('secretBtn').style.display='flex';
  document.getElementById('editorView').className='editor';
}

// ===== CUSTOMER =====
function renderSidebar(){
  document.getElementById('sidebar').innerHTML=MENU.map((c,i)=>`
    <div class="cat-item ${i===0?'active':''}" id="cat-${i}" onclick="scrollToSection(${i})">${c.cat}</div>
  `).join('');
}
function renderMenu(){
  document.getElementById('menuList').innerHTML=MENU.map((c,ci)=>`
    <div id="section-${ci}">
      <div class="section-title">${c.cat}</div>
      ${c.items.map(item=>`
        <div class="menu-item">
          <div class="item-img">${item.emoji}</div>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-badges">
              ${item.badges.includes('hot')?'<span class="badge badge-hot">🔥 爆款</span>':''}
              ${item.badges.includes('new')?'<span class="badge badge-new">✨ 新品</span>':''}
              ${item.badges.includes('rec')?'<span class="badge badge-rec">👍 推荐</span>':''}
            </div>
            <div class="item-tags">月售${item.monthly}+ · ${item.tags}</div>
            <div class="item-bottom">
              <div>
                <span class="item-price">¥${item.price}</span>
                ${item.orig?`<span class="item-price-orig">¥${item.orig}</span>`:''}
              </div>
              <div class="cart-ctrl" id="ctrl-${item.id}">
                <button class="btn-add" onclick="addItem(${item.id})">+</button>
              </div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}
function getItem(id){for(const c of MENU)for(const it of c.items)if(it.id===id)return it;}
function addItem(id){
  const it=getItem(id);
  if(!cart[id])cart[id]={name:it.name,price:it.price,qty:0};
  cart[id].qty++;updateCtrl(id);updateCartBar();
}
function removeItem(id){
  if(!cart[id])return;
  cart[id].qty--;
  if(cart[id].qty<=0)delete cart[id];
  updateCtrl(id);updateCartBar();
}
function updateCtrl(id){
  const qty=cart[id]?.qty||0;
  const el=document.getElementById('ctrl-'+id);
  if(!el)return;
  el.innerHTML=qty===0
    ?`<button class="btn-add" onclick="addItem(${id})">+</button>`
    :`<button class="btn-minus" onclick="removeItem(${id})">−</button><span class="cart-qty">${qty}</span><button class="btn-add" onclick="addItem(${id})">+</button>`;
}
function updateCartBar(){
  const items=Object.values(cart).filter(i=>i.qty>0);
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  const count=items.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cartAmount').textContent='¥'+total.toFixed(1);
  document.getElementById('cartSub').textContent=count>0?`已选 ${count} 件`:'还没选菜哦～';
  const cc=document.getElementById('cartCount');
  cc.style.display=count>0?'flex':'none';cc.textContent=count;
  document.getElementById('submitBtn').className='submit-btn'+(count>0?'':' disabled');
}
function scrollToSection(i){
  document.getElementById('section-'+i)?.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.cat-item').forEach((el,j)=>el.classList.toggle('active',j===i));
}
function openSheet(){
  const items=Object.values(cart).filter(i=>i.qty>0);
  if(!items.length)return;
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('orderListDetail').innerHTML=items.map(i=>`
    <div class="order-row"><span>${i.name} x${i.qty}</span><span>¥${(i.price*i.qty).toFixed(1)}</span></div>
  `).join('');
  document.getElementById('sheetTotal').textContent='¥'+total.toFixed(1);
  document.getElementById('orderSheet').classList.add('show');
}
function submitOrder(){
  const items=Object.values(cart).filter(i=>i.qty>0);
  const note=document.getElementById('noteInput').value;
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  const orderText=items.map(i=>`${i.name} x${i.qty}  ¥${(i.price*i.qty).toFixed(1)}`).join('\n');
  document.getElementById('orderSheet').classList.remove('show');
  if(CONFIG.serviceId&&CONFIG.templateId&&CONFIG.publicKey&&CONFIG.email){
    emailjs.init(CONFIG.publicKey);
    emailjs.send(CONFIG.serviceId,CONFIG.templateId,{
      to_email:CONFIG.email,order_content:orderText,
      note:note||'无备注',total:'¥'+total.toFixed(1)
    }).then(()=>showToast('📧 通知已发送！')).catch(()=>showToast('发送失败，检查EmailJS配置'));
  }
  document.getElementById('successMsg').innerHTML=`大厨已收到通知<br>${note?'备注：'+note:'马上开做！'}`;
  document.getElementById('successOverlay').classList.add('show');
}
function closeSuccess(){
  document.getElementById('successOverlay').classList.remove('show');
  Object.keys(cart).forEach(k=>delete cart[k]);
  updateCartBar();
  MENU.forEach(c=>c.items.forEach(it=>updateCtrl(it.id)));
  document.getElementById('noteInput').value='';
}

// ===== EDITOR =====
function renderEditor(){
  document.getElementById('edShopName').value=CONFIG.shopName;
  document.getElementById('edShopTag').value=CONFIG.shopTag;
  document.getElementById('edServiceId').value=CONFIG.serviceId;
  document.getElementById('edTemplateId').value=CONFIG.templateId;
  document.getElementById('edPublicKey').value=CONFIG.publicKey;
  document.getElementById('edEmail').value=CONFIG.email;
  document.getElementById('edPassword').value='';
  renderCatList();
}
function renderCatList(){
  document.getElementById('catList').innerHTML=MENU.map((cat,ci)=>`
    <div class="cat-block">
      <div class="cat-header">
        <input class="ed-input" style="flex:1" value="${cat.cat}" id="catName-${ci}" placeholder="分类名">
        <button class="ed-btn ed-btn-del" onclick="delCat(${ci})">删除</button>
      </div>
      ${cat.items.map((it,ii)=>`
        <div class="dish-row">
          <input style="width:32px;text-align:center;padding:6px 4px" value="${it.emoji}" id="emoji-${ci}-${ii}" placeholder="🍜">
          <input style="flex:2;min-width:80px" value="${it.name}" id="dname-${ci}-${ii}" placeholder="菜品名">
          <input style="width:60px" value="${it.price}" id="dprice-${ci}-${ii}" type="number" placeholder="价格">
          <button class="ed-btn ed-btn-del" style="padding:6px 8px;font-size:12px" onclick="delDish(${ci},${ii})">✕</button>
        </div>
      `).join('')}
      <button class="ed-btn ed-btn-add" style="margin-top:6px;font-size:12px;padding:5px 10px" onclick="addDish(${ci})">+ 加菜</button>
    </div>
  `).join('');
}
function addCat(){MENU.push({cat:'新分类',items:[]});renderCatList();}
function delCat(ci){if(MENU.length<=1){showToast('至少保留一个分类');return;}MENU.splice(ci,1);renderCatList();}
function addDish(ci){MENU[ci].items.push({id:nextId++,name:'新菜品',emoji:'🍽️',price:18,orig:null,monthly:0,tags:'',badges:[]});renderCatList();}
function delDish(ci,ii){MENU[ci].items.splice(ii,1);renderCatList();}

function saveAll(){
  const newPw=document.getElementById('edPassword').value.trim();
  if(newPw) PASSWORD=newPw;
  CONFIG.shopName=document.getElementById('edShopName').value||CONFIG.shopName;
  CONFIG.shopTag=document.getElementById('edShopTag').value;
  CONFIG.serviceId=document.getElementById('edServiceId').value.trim();
  CONFIG.templateId=document.getElementById('edTemplateId').value.trim();
  CONFIG.publicKey=document.getElementById('edPublicKey').value.trim();
  CONFIG.email=document.getElementById('edEmail').value.trim();
  MENU.forEach((cat,ci)=>{
    cat.cat=document.getElementById('catName-'+ci)?.value||cat.cat;
    cat.items.forEach((it,ii)=>{
      it.emoji=document.getElementById('emoji-'+ci+'-'+ii)?.value||it.emoji;
      it.name=document.getElementById('dname-'+ci+'-'+ii)?.value||it.name;
      it.price=parseFloat(document.getElementById('dprice-'+ci+'-'+ii)?.value)||it.price;
    });
  });
  document.getElementById('shopNameDisplay').textContent=CONFIG.shopName;
  document.getElementById('shopTagDisplay').textContent=CONFIG.shopTag;
  renderSidebar();renderMenu();
  Object.keys(cart).forEach(k=>delete cart[k]);updateCartBar();
  showToast('✅ 保存成功！');
  setTimeout(()=>exitEditor(),800);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}

renderSidebar();renderMenu();
</script>
</body>
</html>
